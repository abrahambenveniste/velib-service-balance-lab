[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velib-service-balance-lab"
version = "0.1.0"
description = "A reproducible study of shared-bike service reliability in the Paris region."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
velib-collect = "velib_lab.collector:main"

[tool.setuptools.packages.find]
where = ["src"]
